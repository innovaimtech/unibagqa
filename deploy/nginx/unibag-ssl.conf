# Redirección automática de HTTP (puerto 80) a HTTPS (puerto 443)
server {
    listen 80;
    listen [::]:80;
    server_name unibag.innovaimtech.online;

    # Permitir validación de renovación de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/innovaimtech/unibagqa/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor Seguro HTTPS (puerto 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name unibag.innovaimtech.online;

    root /var/www/innovaimtech/unibagqa/public;
    index index.php index.html;

    client_max_body_size 50M;

    # Rutas estándar del certificado SSL generado por Certbot / Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/unibag.innovaimtech.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unibag.innovaimtech.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión: las páginas HTML/JSON y los recursos pesan mucho menos en la red
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Recursos estáticos: el navegador los guarda y no los vuelve a pedir en cada página
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        # Si no es un archivo real (documentos del ERP en /docs/...), lo atiende PHP.
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 120s;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/unibag_ssl_access.log;
    error_log /var/log/nginx/unibag_ssl_error.log;
}

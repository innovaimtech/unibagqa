server {
    listen 80;
    listen [::]:80;
    server_name unibag.innovaimtech.online;

    root /var/www/innovaimtech/unibagqa/public;
    index index.php index.html;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Detectar el socket php disponible (php8.1 o php8.2)
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/unibag_access.log;
    error_log /var/log/nginx/unibag_error.log;
}

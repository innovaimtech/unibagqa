server {
    listen 80;
    listen [::]:80;
    server_name unibag.innovaimtech.online;

    root /var/www/innovaimtech/unibagqa/public;
    index index.php index.html;

    client_max_body_size 50M;

    # Compresión: las páginas HTML/JSON y los recursos pesan mucho menos en la red
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Recursos estáticos: el navegador los guarda y no los vuelve a pedir en cada página
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Detectar el socket php disponible (php8.1 o php8.2)
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 120s;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/unibag_access.log;
    error_log /var/log/nginx/unibag_error.log;
}

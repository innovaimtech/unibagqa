<VirtualHost *:80>
    ServerName unibag.innovaimtech.online
    DocumentRoot /var/www/unibag/current/public

    <Directory /var/www/unibag/current/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/unibag_error.log
    CustomLog ${APACHE_LOG_DIR}/unibag_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName unibag.innovaimtech.online
    DocumentRoot /var/www/unibag/current/public

    <Directory /var/www/unibag/current/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/unibag.innovaimtech.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/unibag.innovaimtech.online/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/unibag_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/unibag_ssl_access.log combined
</VirtualHost>
</IfModule>
